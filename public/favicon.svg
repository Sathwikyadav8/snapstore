<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161b" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />
  <rect width="98" height="98" x="1" y="1" rx="25" fill="none" stroke="#242832" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="30" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Store Icon Emblem -->
  <path d="M 28 38 L 34 24 C 34.8 22 36.5 21 38.5 21 L 61.5 21 C 63.5 21 65.2 22 66 24 L 72 38 L 72 73 C 72 76.8 68.8 80 65 80 L 35 80 C 31.2 80 28 76.8 28 73 Z" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Store Roof Awning line -->
  <path d="M 24 38 L 76 38" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 36 38 Q 43 45 50 38 Q 57 45 64 38" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Sparkle AI Star -->
  <path d="M 50 49 L 52.2 56.8 L 60 59 L 52.2 61.2 L 50 69 L 47.8 61.2 L 40 59 L 47.8 56.8 Z" fill="#ffffff" filter="url(#glow)" />
</svg>
